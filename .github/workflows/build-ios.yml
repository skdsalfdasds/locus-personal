name: Build personal Locus IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - name: Install project generator
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Run movement timing checks
        run: |
          set -euo pipefail
          mkdir -p outputs
          swiftc Locus/Engine/MovementTiming.swift Tests/MovementTimingChecks.swift -o "$RUNNER_TEMP/movement-checks" 2>&1 | tee outputs/timing-checks.log
          "$RUNNER_TEMP/movement-checks" 2>&1 | tee -a outputs/timing-checks.log
      - name: Build unsigned device IPA
        run: bash scripts/build-unsigned-ios.sh
      - name: Check restore hold confirmation and connection failure behavior
        run: |
          set -euo pipefail
          swiftc Locus/Support/HoldConfirmation.swift Tests/HoldConfirmationChecks.swift -o "$RUNNER_TEMP/hold-checks" 2>&1 | tee outputs/safety-checks.log
          "$RUNNER_TEMP/hold-checks" 2>&1 | tee -a outputs/safety-checks.log
          mkdir -p "$RUNNER_TEMP/engine-stubs"
          clang -dynamiclib Tests/Stubs/idevice_stub.c -o "$RUNNER_TEMP/engine-stubs/libidevice_ffi.dylib"
          swiftc -I Tests/Stubs -L "$RUNNER_TEMP/engine-stubs" -lidevice_ffi Locus/Engine/LocationEngine.swift Tests/LocationEngineChecks.swift -o "$RUNNER_TEMP/engine-checks" 2>&1 | tee -a outputs/safety-checks.log
          DYLD_LIBRARY_PATH="$RUNNER_TEMP/engine-stubs" "$RUNNER_TEMP/engine-checks" 2>&1 | tee -a outputs/safety-checks.log
      - name: Check saved route and hold recovery
        run: |
          set -euo pipefail
          swiftc Locus/Engine/PlaybackStore.swift Tests/PlaybackStoreChecks.swift -o "$RUNNER_TEMP/playback-checks" 2>&1 | tee outputs/playback-checks.log
          "$RUNNER_TEMP/playback-checks" 2>&1 | tee -a outputs/playback-checks.log
      - name: Check remaining route geometry
        run: |
          set -euo pipefail
          swiftc Locus/Engine/RouteLine.swift Tests/RouteLineChecks.swift -o "$RUNNER_TEMP/route-line-checks" 2>&1 | tee outputs/route-line-checks.log
          "$RUNNER_TEMP/route-line-checks" 2>&1 | tee -a outputs/route-line-checks.log
      - name: Check developer tunnel detection
        run: |
          set -euo pipefail
          swiftc Locus/Engine/DeviceTunnel.swift Locus/Support/TunnelMonitor.swift Tests/TunnelMonitorChecks.swift -o "$RUNNER_TEMP/tunnel-checks" 2>&1 | tee outputs/tunnel-checks.log
          "$RUNNER_TEMP/tunnel-checks" 2>&1 | tee -a outputs/tunnel-checks.log
      - name: Save IPA and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Locus-personal-unsigned
          path: |
            outputs/Locus-personal-unsigned.ipa
            outputs/build.log
            outputs/timing-checks.log
            outputs/tunnel-checks.log
            outputs/playback-checks.log
            outputs/safety-checks.log
            outputs/route-line-checks.log
          retention-days: 7
          if-no-files-found: error
