name: Build location interface probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Build isolated observer and XCTest runner
        working-directory: experiments/LocationProbe
        run: |
          set -euo pipefail
          xcodegen generate
          mkdir -p outputs
          xcodebuild build-for-testing -project WaypointLocationProbe.xcodeproj -scheme WaypointLocationProbe -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' 2>&1 | tee outputs/build.log
          for app in build/Build/Products/Debug-iphoneos/*.app; do
            staging="$(mktemp -d)"
            mkdir -p "$staging/Payload"
            ditto "$app" "$staging/Payload/$(basename "$app")"
            ditto -c -k --keepParent "$staging/Payload" "outputs/$(basename "$app" .app)-unsigned.ipa"
          done
          shasum -a 256 outputs/*.ipa > outputs/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Waypoint-location-interface-probe
          path: experiments/LocationProbe/outputs/
  simulator:
    name: Observe rich location delivery in isolated simulator
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Select an available iPhone simulator
        run: |
          set -euo pipefail
          simulator="$(xcrun simctl list devices available --json | python3 -c 'import sys,json;d=json.load(sys.stdin);print(next(v["udid"] for values in d["devices"].values() for v in values if v["name"].startswith("iPhone")))')"
          echo "WAYPOINT_SIMULATOR_ID=$simulator" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator" || true
          xcrun simctl bootstatus "$simulator" -b
      - name: Run independent observer test
        working-directory: experiments/LocationProbe
        run: |
          set -euo pipefail
          xcodegen generate
          mkdir -p outputs
          xcodebuild test -project WaypointLocationProbe.xcodeproj -scheme WaypointLocationProbe -configuration Debug -destination "platform=iOS Simulator,id=$WAYPOINT_SIMULATOR_ID" -derivedDataPath build-simulator -resultBundlePath outputs/LocationProbe.xcresult CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' 2>&1 | tee outputs/simulator-run.log
      - name: Export simulator observations and test attachments
        if: always()
        working-directory: experiments/LocationProbe
        run: |
          mkdir -p outputs
          data="$(xcrun simctl get_app_container "$WAYPOINT_SIMULATOR_ID" app.waypoint.locationprobe data 2>/dev/null || true)"
          if [ -n "$data" ] && [ -f "$data/Documents/location-observations.jsonl" ]; then
            cp "$data/Documents/location-observations.jsonl" outputs/simulator-observations.jsonl
          fi
          if [ -d outputs/LocationProbe.xcresult ]; then
            xcrun xcresulttool export attachments --path outputs/LocationProbe.xcresult --output-path outputs/attachments || true
          fi
      - name: Save simulator evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Waypoint-location-simulator-evidence
          path: experiments/LocationProbe/outputs/
