name: WaypointLocationProbe
options:
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  WaypointLocationProbe:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.waypoint.locationprobe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Waypoint Probe
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Read the location fields iOS delivers during an explicit location-interface test.
        INFOPLIST_KEY_NSMotionUsageDescription: Show the actual motion activity detected by iOS during an explicit test.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
  WaypointLocationProbeTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: WaypointLocationProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.waypoint.locationprobe.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WaypointLocationProbe
schemes:
  WaypointLocationProbe:
    build:
      targets:
        WaypointLocationProbe: all
        WaypointLocationProbeTests: [test]
    test:
      targets: [WaypointLocationProbeTests]
